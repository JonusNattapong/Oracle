        - paragraph [ref=f9e530]:
          - text: Fast mode is not available on Claude Opus 4.7 (requests with
          - code [ref=f9e531]: "speed: \"fast\""
          - text: return an error) or Claude Opus 4.6 (requests run at standard speed and are billed at standard rates). See
          - link "Fast mode" [ref=f9e532] [cursor=pointer]:
            - /url: /docs/en/build-with-claude/fast-mode#supported-models
          - text: .
        - paragraph [ref=f9e533]: "Fast mode pricing stacks with other pricing modifiers:"
        - list [ref=f9e534]:
          - listitem [ref=f9e535]:
            - text: •
            - link "Prompt caching multipliers" [ref=f9e536] [cursor=pointer]:
              - /url: "#prompt-caching"
            - text: apply on top of fast mode pricing
          - listitem [ref=f9e537]:
            - text: •
            - link "Data residency" [ref=f9e538] [cursor=pointer]:
              - /url: /docs/en/manage-claude/data-residency
            - text: multipliers apply on top of fast mode pricing
        - paragraph [ref=f9e539]:
          - text: Fast mode is not available with the
          - link "Batch API" [ref=f9e540] [cursor=pointer]:
            - /url: "#batch-processing"
          - text: .
        - paragraph [ref=f9e541]:
          - text: For more information, see
          - link "Fast mode" [ref=f9e542] [cursor=pointer]:
            - /url: /docs/en/build-with-claude/fast-mode
          - text: .
