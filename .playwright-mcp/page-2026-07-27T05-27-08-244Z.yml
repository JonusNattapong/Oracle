        - paragraph [ref=f9e1247]:
          - strong [ref=f9e1248]: How is token usage calculated?
        - paragraph [ref=f9e1249]: Tokens are pieces of text that models process. As a rough estimate, 1 token is approximately 4 characters or 0.75 words in English. The exact count varies by language and content type.
