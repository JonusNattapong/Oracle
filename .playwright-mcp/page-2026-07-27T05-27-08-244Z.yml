          - generic [ref=f9e249]: 
          - paragraph [ref=f9e252]: Introductory pricing of $2/$10 per million input/output tokens is in effect through August 31, 2026, after which the standard pricing of $3/$15 per million input/output tokens will take effect.
        - generic [ref=f9e253]:
          - generic [ref=f9e254]: 
          - paragraph [ref=f9e257]:
            - text: MTok = Million tokens. The "Base Input Tokens" column shows standard input pricing, the "5m Cache Writes", "1h Cache Writes", and "Cache Hits & Refreshes" columns are specific to
            - link "prompt caching" [ref=f9e258] [cursor=pointer]:
              - /url: "#prompt-caching"
            - text: ", and \"Output Tokens\" shows output pricing. See"
            - link "prompt caching pricing" [ref=f9e259] [cursor=pointer]:
              - /url: "#prompt-caching"
            - text: for an explanation of the cache columns and pricing multipliers.
        - generic [ref=f9e260]:
          - generic [ref=f9e261]: 
          - paragraph [ref=f9e264]: Claude 4.7 and later models and Claude Mythos Preview use a newer tokenizer that contributes to their improved performance on a wide range of tasks. This tokenizer produces approximately 30% more tokens for the same text. The exact increase depends on the content and workload shape. Claude Sonnet 4.6 and earlier models use the previous tokenizer.
        - paragraph [ref=f9e265]:
          - text: For Claude Platform on AWS pricing, see
          - link "Claude Platform on AWS pricing" [ref=f9e266] [cursor=pointer]:
