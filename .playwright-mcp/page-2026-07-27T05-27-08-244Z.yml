          - text: .
        - paragraph [ref=f9e276]:
          - text: Claude models are available on
          - link "Amazon Bedrock" [ref=f9e277] [cursor=pointer]:
            - /url: /docs/en/build-with-claude/claude-in-amazon-bedrock
          - text: and
          - link "Google Cloud" [ref=f9e278] [cursor=pointer]:
            - /url: /docs/en/build-with-claude/claude-on-vertex-ai
          - text: ". For official pricing, visit:"
        - list [ref=f9e279]:
          - listitem [ref=f9e280]:
            - text: •
            - link "Amazon Bedrock pricing" [ref=f9e281] [cursor=pointer]:
              - /url: https://aws.amazon.com/bedrock/pricing/
          - listitem [ref=f9e282]:
            - text: •
            - link "Google Cloud pricing" [ref=f9e283] [cursor=pointer]:
              - /url: https://cloud.google.com/vertex-ai/generative-ai/pricing#claude-models
        - generic [ref=f9e284]:
          - generic [ref=f9e285]: 
          - generic [ref=f9e287]:
            - paragraph [ref=f9e288]:
              - strong [ref=f9e289]: Regional and multi-region endpoint pricing for Claude 4.5 models and beyond
            - paragraph [ref=f9e290]: "Starting with Claude Sonnet 4.5, Haiku 4.5, and Opus 4.5:"
            - list [ref=f9e291]:
              - listitem [ref=f9e292]:
                - text: •
                - strong [ref=f9e293]: Bedrock
                - text: "offers two endpoint types: global endpoints (dynamic routing for maximum availability) and regional endpoints (guaranteed data routing through specific geographic regions)."
              - listitem [ref=f9e294]:
                - text: •
                - strong [ref=f9e295]: Google Cloud
                - text: "offers three endpoint types: global endpoints, multi-region endpoints (dynamic routing within a geographic area), and regional endpoints."
            - paragraph [ref=f9e296]:
              - text: Regional and multi-region endpoints include a 10% premium over global endpoints. The Claude API (first-party) is global by default; for first-party data residency options and pricing, see
              - link "Data residency pricing" [ref=f9e297] [cursor=pointer]:
                - /url: "#data-residency-pricing"
              - text: .
            - paragraph [ref=f9e298]:
              - strong [ref=f9e299]: "Scope:"
              - text: This pricing structure applies to Claude Sonnet 4.5, Haiku 4.5, Opus 4.5, and all future models. Earlier models (Claude Opus 4.1 (deprecated) and prior releases) retain their existing pricing.
            - paragraph [ref=f9e300]: "For implementation details and code examples:"
            - list [ref=f9e301]:
              - listitem [ref=f9e302]:
                - text: •
                - link "Amazon Bedrock global vs regional endpoints" [ref=f9e303] [cursor=pointer]:
                  - /url: /docs/en/build-with-claude/claude-in-amazon-bedrock#regions
                - text: for Opus 4.7, Haiku 4.5, and later models, or
                - link "the legacy integration" [ref=f9e304] [cursor=pointer]:
                  - /url: /docs/en/build-with-claude/claude-on-amazon-bedrock-legacy#global-vs-regional-endpoints
                - text: for all other models on Bedrock
              - listitem [ref=f9e305]:
                - text: •
                - link "Google Cloud global, multi-region, and regional endpoints" [ref=f9e306] [cursor=pointer]:
                  - /url: /docs/en/build-with-claude/claude-on-vertex-ai#global-multi-region-and-regional-endpoints
        - heading "Copy link to clipboard Claude Platform on AWS pricing" [level=2] [ref=f9e307]:
          - generic [ref=f9e308]:
            - button "Copy link to clipboard" [ref=f9e310] [cursor=pointer]:
              - generic [ref=f9e311]: 
            - generic [ref=f9e312]: Claude Platform on AWS pricing
        - paragraph [ref=f9e313]:
          - link "Claude Platform on AWS" [ref=f9e314] [cursor=pointer]:
            - /url: /docs/en/build-with-claude/claude-platform-on-aws
          - text: bills through AWS Marketplace using Claude Consumption Units (CCUs). Anthropic rates your token usage in USD at standard per-model, per-feature rates, applies any negotiated discount, converts the result to CCUs at $0.01 per CCU, and reports the CCU quantity to AWS Marketplace hourly. Your AWS bill shows a single CCU line item.
        - table [ref=f9e316]:
          - rowgroup [ref=f9e317]:
            - row [ref=f9e318]:
              - columnheader "Concept" [ref=f9e319]
              - columnheader "Details" [ref=f9e320]
          - rowgroup [ref=f9e321]:
            - row [ref=f9e322]:
              - cell [ref=f9e323]:
                - strong [ref=f9e324]: Billing unit
              - cell "Claude Consumption Unit (CCU)" [ref=f9e325]
            - row [ref=f9e326]:
              - cell [ref=f9e327]:
                - strong [ref=f9e328]: CCU price
              - cell "$0.01 per CCU (fixed; discounts apply at token-to-CCU conversion, not to the CCU price)" [ref=f9e329]
            - row [ref=f9e330]:
              - cell [ref=f9e331]:
                - strong [ref=f9e332]: Conversion
              - cell [ref=f9e333]:
                - text: Token usage rated in USD at standard per-model, per-feature rates (same as
                - link "Claude API pricing" [ref=f9e334] [cursor=pointer]:
                  - /url: "#model-pricing"
                - text: ), then converted to CCUs at $0.01 per CCU
            - row [ref=f9e335]:
              - cell [ref=f9e336]:
                - strong [ref=f9e337]: Billing cadence
              - cell "Hourly metering to AWS Marketplace; monthly invoices" [ref=f9e338]
            - row [ref=f9e339]:
              - cell [ref=f9e340]:
                - strong [ref=f9e341]: Payment model
              - cell "Arrears only (postpaid); no prepaid credits" [ref=f9e342]
            - row [ref=f9e343]:
              - cell [ref=f9e344]:
                - strong [ref=f9e345]: Discounts
              - cell "Applied as fewer CCUs metered" [ref=f9e346]
            - row [ref=f9e347]:
              - cell [ref=f9e348]:
                - strong [ref=f9e349]: Tax
              - cell "Pre-tax metering; AWS Marketplace handles tax" [ref=f9e350]
            - row [ref=f9e351]:
              - cell [ref=f9e352]:
                - strong [ref=f9e353]: Cost visibility
              - cell "Real-time breakdown in the Claude Console (access through the AWS Console); AWS Cost Explorer shows aggregated CCU" [ref=f9e354]
        - generic [ref=f9e355]:
          - generic [ref=f9e356]: 
          - paragraph [ref=f9e359]:
            - strong [ref=f9e360]: Claude Consumption Units.
            - text: If Customer accesses the Services through certain Marketplace Platforms (e.g., Claude Platform on AWS), usage will be invoiced in Claude Consumption Units ("CCU") rather than per MTok. A CCU is a unit of measure used solely for Marketplace Platform invoicing. One hundred (100) CCU represents $1.00 USD of fees owed for the Services, calculated at the applicable prices on
            - link "claude.com/pricing#api" [ref=f9e361] [cursor=pointer]:
              - /url: https://claude.com/pricing#api
            - text: ", after application of any discounts."
