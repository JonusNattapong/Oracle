            - row [ref=f9e404]:
              - cell [ref=f9e405]:
                - strong [ref=f9e406]: CCU price
              - cell "$0.01 per CCU (fixed; discounts apply at token-to-CCU conversion, not to the CCU price)" [ref=f9e407]
            - row [ref=f9e408]:
              - cell [ref=f9e409]:
                - strong [ref=f9e410]: Conversion
              - cell [ref=f9e411]:
                - text: Token usage rated in USD at standard per-model, per-feature rates (same as
                - link "Claude API pricing" [ref=f9e412] [cursor=pointer]:
                  - /url: "#model-pricing"
                - text: ), then converted to CCUs at $0.01 per CCU
            - row [ref=f9e413]:
              - cell [ref=f9e414]:
                - strong [ref=f9e415]: Billing cadence
              - cell "Hourly metering to the Azure Marketplace; monthly invoices" [ref=f9e416]
            - row [ref=f9e417]:
              - cell [ref=f9e418]:
                - strong [ref=f9e419]: Payment model
              - cell "Arrears only (postpaid); no prepaid credits" [ref=f9e420]
            - row [ref=f9e421]:
              - cell [ref=f9e422]:
                - strong [ref=f9e423]: Discounts
              - cell "Applied as fewer CCUs metered" [ref=f9e424]
            - row [ref=f9e425]:
              - cell [ref=f9e426]:
                - strong [ref=f9e427]: Tax
              - cell "Pre-tax metering; Azure Marketplace handles tax" [ref=f9e428]
            - row [ref=f9e429]:
              - cell [ref=f9e430]:
                - strong [ref=f9e431]: Cost visibility
              - cell "Azure Cost Management shows aggregated CCU" [ref=f9e432]
        - generic [ref=f9e433]:
          - generic [ref=f9e434]: 
          - paragraph [ref=f9e437]:
            - strong [ref=f9e438]: Claude Consumption Units.
            - text: If Customer accesses the Services through certain Marketplace Platforms (e.g., Claude Platform on AWS, Claude in Microsoft Foundry), usage will be invoiced in Claude Consumption Units ("CCU") rather than per MTok. A CCU is a unit of measure used solely for Marketplace Platform invoicing. One hundred (100) CCU represents $1.00 USD of fees owed for the Services, calculated at the applicable prices on
            - link "claude.com/pricing#api" [ref=f9e439] [cursor=pointer]:
              - /url: https://claude.com/pricing#api
            - text: ", after application of any discounts."
        - heading "Copy link to clipboard Inference geography" [level=3] [ref=f9e440]:
          - generic [ref=f9e441]:
            - button "Copy link to clipboard" [ref=f9e443] [cursor=pointer]:
              - generic [ref=f9e444]: 
            - generic [ref=f9e445]: Inference geography
        - paragraph [ref=f9e446]:
          - text: Deployments hosted on Azure can use the US Data Zone Standard deployment type, which keeps inference within the United States. This is equivalent to
          - code [ref=f9e447]: "inference_geo: \"us\""
          - text: on the Claude API and applies the same 1.1x pricing multiplier. See
          - link "Data residency" [ref=f9e448] [cursor=pointer]:
            - /url: /docs/en/manage-claude/data-residency
          - text: for details.
        - heading "Copy link to clipboard Feature-specific pricing" [level=2] [ref=f9e449]:
          - generic [ref=f9e450]:
            - button "Copy link to clipboard" [ref=f9e452] [cursor=pointer]:
              - generic [ref=f9e453]: 
            - generic [ref=f9e454]: Feature-specific pricing
        - heading "Copy link to clipboard Prompt caching" [level=3] [ref=f9e455]:
          - generic [ref=f9e456]:
            - button "Copy link to clipboard" [ref=f9e458] [cursor=pointer]:
              - generic [ref=f9e459]: 
            - generic [ref=f9e460]: Prompt caching
        - paragraph [ref=f9e461]: Prompt caching reduces costs and latency by reusing previously processed portions of your prompt across API calls. Instead of reprocessing the same large system prompt, document, or conversation history on every request, the API reads from cache at a fraction of the standard input price.
        - paragraph [ref=f9e462]: "There are two ways to enable prompt caching:"
        - list [ref=f9e463]:
          - listitem [ref=f9e464]:
            - text: •
            - strong [ref=f9e465]: "Automatic caching:"
            - text: Add a single
            - code [ref=f9e466]: cache_control
            - text: field at the top level of your request. The system automatically manages cache breakpoints as conversations grow. This is the recommended starting point for most use cases.
          - listitem [ref=f9e467]:
            - text: •
            - strong [ref=f9e468]: "Explicit cache breakpoints:"
            - text: Place
            - code [ref=f9e469]: cache_control
            - text: directly on individual content blocks for fine-grained control over exactly what gets cached.
        - paragraph [ref=f9e470]: "Prompt caching uses the following pricing multipliers relative to base input token rates:"
        - table [ref=f9e472]:
          - rowgroup [ref=f9e473]:
            - row [ref=f9e474]:
              - columnheader "Cache operation" [ref=f9e475]
              - columnheader "Multiplier" [ref=f9e476]
              - columnheader "Duration" [ref=f9e477]
          - rowgroup [ref=f9e478]:
            - row [ref=f9e479]:
              - cell "5-minute cache write" [ref=f9e480]
              - cell "1.25x base input price" [ref=f9e481]
              - cell "Cache valid for 5 minutes" [ref=f9e482]
            - row [ref=f9e483]:
              - cell "1-hour cache write" [ref=f9e484]
              - cell "2x base input price" [ref=f9e485]
              - cell "Cache valid for 1 hour" [ref=f9e486]
            - row [ref=f9e487]:
              - cell "Cache read (hit)" [ref=f9e488]
              - cell "0.1x base input price" [ref=f9e489]
              - cell "Same duration as the preceding write" [ref=f9e490]
        - paragraph [ref=f9e491]: Cache write tokens are charged when content is first stored. Cache read tokens are charged when a subsequent request retrieves the cached content. A cache hit costs 10% of the standard input price, which means caching pays off after just one cache read for the 5-minute duration (1.25x write), or after two cache reads for the 1-hour duration (2x write).
        - paragraph [ref=f9e492]: These multipliers stack with other pricing modifiers, including the Batch API discount and data residency.
        - paragraph [ref=f9e493]:
          - text: For implementation details, supported models, and code examples, see
          - link "Prompt caching" [ref=f9e494] [cursor=pointer]:
            - /url: /docs/en/build-with-claude/prompt-caching
          - text: .
        - heading "Copy link to clipboard Data residency pricing" [level=3] [ref=f9e495]:
          - generic [ref=f9e496]:
            - button "Copy link to clipboard" [ref=f9e498] [cursor=pointer]:
              - generic [ref=f9e499]: 
            - generic [ref=f9e500]: Data residency pricing
        - paragraph [ref=f9e501]:
          - text: For Claude 4.6 and later models, specifying US-only inference through the
          - code [ref=f9e502]: inference_geo
          - text: parameter incurs a 1.1x multiplier on all token pricing categories, including input tokens, output tokens, cache writes, and cache reads. Global routing (the default) uses standard pricing.
        - paragraph [ref=f9e503]:
          - text: This applies to the Claude API (first-party) and Claude Platform on AWS. On Claude in Microsoft Foundry, the same 1.1x multiplier applies to deployments that use the US Data Zone Standard deployment type (see
          - link "Inference geography" [ref=f9e504] [cursor=pointer]:
            - /url: "#foundry-inference-geography"
          - text: ). Partner-operated platforms (Bedrock and Google Cloud) have independent regional pricing. See
          - link "Bedrock" [ref=f9e505] [cursor=pointer]:
            - /url: https://aws.amazon.com/bedrock/pricing/
          - text: and
          - link "Google Cloud" [ref=f9e506] [cursor=pointer]:
            - /url: https://cloud.google.com/vertex-ai/generative-ai/pricing#claude-models
          - text: for details. Earlier models do not support the
          - code [ref=f9e507]: inference_geo
          - text: parameter and always use standard pricing; requests that include the parameter on these models return a 400 error.
        - paragraph [ref=f9e508]:
          - text: For more information, see
          - link "Data residency" [ref=f9e509] [cursor=pointer]:
            - /url: /docs/en/manage-claude/data-residency
          - text: .
        - heading "Copy link to clipboard Fast mode pricing" [level=3] [ref=f9e510]:
          - generic [ref=f9e511]:
            - button "Copy link to clipboard" [ref=f9e513] [cursor=pointer]:
              - generic [ref=f9e514]: 
            - generic [ref=f9e515]: Fast mode pricing
        - paragraph [ref=f9e516]:
          - link "Fast mode" [ref=f9e517] [cursor=pointer]:
            - /url: /docs/en/build-with-claude/fast-mode
          - text: ", in research preview, provides significantly faster output for Claude Opus 5 and Claude Opus 4.8 at premium pricing. Fast mode pricing applies across the full context window, including requests over 200k input tokens. Fast mode is available on the Claude API (first-party) only; it is not available on Claude Platform on AWS or partner-operated cloud platforms."
        - table [ref=f9e519]:
          - rowgroup [ref=f9e520]:
            - row [ref=f9e521]:
              - columnheader "Model" [ref=f9e522]
              - columnheader "Input" [ref=f9e523]
              - columnheader "Output" [ref=f9e524]
          - rowgroup [ref=f9e525]:
