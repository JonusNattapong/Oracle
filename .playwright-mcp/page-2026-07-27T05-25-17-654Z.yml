              - paragraph [ref=f1e196]:
                - strong [ref=f1e197]: How it works.
              - list [ref=f1e198]:
                - listitem [ref=f1e199]: Monthly subscription credits. Reset at the start of every cycle.
                - listitem [ref=f1e200]: Top up at model cost. Credits roll over. Forever.
                - listitem [ref=f1e201]:
                  - text: Enterprise? Email
                  - link "support@commandcode.ai" [ref=f1e202] [cursor=pointer]:
                    - /url: mailto:support@commandcode.ai
                  - text: for custom terms, SLAs, and dedicated support.
              - heading [level=2] [ref=f1e204]:
                - link "Usage limits" [ref=f1e206] [cursor=pointer]:
                  - /url: "#usage-limits"
              - paragraph [ref=f1e207]:
                - text: On top of your monthly credits, every subscription plan has two
                - strong [ref=f1e208]: rolling usage limits
                - text: "- a 5-hour window and a weekly window. They smooth out bursts so a single busy session can't drain a whole month in an afternoon, while your full monthly pool stays available across the cycle."
              - paragraph [ref=f1e209]:
                - text: Each window is a share of your plan's
                - strong [ref=f1e210]: monthly credit allocation
                - text: ":"
              - list [ref=f1e211]:
                - listitem [ref=f1e212]:
                  - strong [ref=f1e213]: 5-hour limit
                  - text: "- 30% of your monthly credits"
                - listitem [ref=f1e214]:
                  - strong [ref=f1e215]: Weekly limit
                  - text: "- 60% of your monthly credits"
              - table [ref=f1e218]:
                - rowgroup [ref=f1e219]:
                  - row [ref=f1e220]:
                    - columnheader "Plan" [ref=f1e221]
                    - columnheader "Your cost" [ref=f1e222]
