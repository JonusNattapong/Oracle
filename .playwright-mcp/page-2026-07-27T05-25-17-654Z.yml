              - paragraph [ref=f1e257]:
                - text: Limits are measured in
                - strong [ref=f1e258]: credit value
                - text: ", not request count - so how many requests you get depends on the models you run. Cheaper models like DeepSeek V4 Flash stretch much further than premium models like Claude Opus. The"
                - link "usage estimates" [ref=f1e259] [cursor=pointer]:
                  - /url: "#usage-estimates"
                - text: below and the calculator help you gauge your own mix.
              - paragraph [ref=f1e260]:
                - text: These windows apply to your plan's
                - strong [ref=f1e261]: included monthly credits
                - text: . Usage with no subscription (free or balance-only) and custom
                - strong [ref=f1e262]: Enterprise
                - text: pools have no rolling window caps - they're gated only by your credit balance. On-demand credits are never throttled either, on any plan (
                - link "details below" [ref=f1e263] [cursor=pointer]:
                  - /url: "#usage-beyond-your-limit"
                - text: ).
              - heading "How the windows roll" [level=3] [ref=f1e264]
              - paragraph [ref=f1e265]:
                - text: Both windows roll
                - strong [ref=f1e266]: from first use
                - text: ", not on a fixed clock:"
              - list [ref=f1e267]:
                - listitem [ref=f1e268]:
                  - text: A window opens on the
                  - strong [ref=f1e269]: first request
                  - text: you make after the previous one elapsed, then resets exactly one window-length later (5 hours or 7 days).
                - listitem [ref=f1e270]: Usage never carries between windows - each new window starts at zero.
                - listitem [ref=f1e271]:
                  - strong [ref=f1e272]: Switching plans resets both windows
                  - text: ", so you always start a new plan with a fresh allowance."
              - heading "Usage beyond your limit" [level=3] [ref=f1e273]
              - paragraph [ref=f1e274]:
                - text: Rolling limits throttle only your
                - strong [ref=f1e275]: included monthly credits
                - text: ". On-demand credits are never throttled:"
              - list [ref=f1e276]:
                - listitem [ref=f1e277]:
                  - strong [ref=f1e278]: "Top-up and pay-as-you-go credits are exempt:"
                  - text: When you have on-demand credits available - or once your monthly pool is spent - requests skip the window check entirely. Adding credits with
                  - code [ref=f1e279]: /extra
                  - text: unblocks you immediately.
                - listitem [ref=f1e280]:
                  - text: While you're over a window limit, Command Code spends your on-demand credits
                  - strong [ref=f1e281]: first
                  - text: ", preserving your monthly allocation for when the window resets."
              - paragraph [ref=f1e282]: "So you're never hard-stopped: keep working past a window on on-demand credits, or wait for it to reset to use your included credits again."
              - heading "Tracking your limits" [level=3] [ref=f1e283]
              - paragraph [ref=f1e284]:
                - text: Run
                - strong [ref=f1e285]:
                  - code [ref=f1e286]: /usage
                - text: in the CLI to see live
                - strong [ref=f1e287]: 5-hour
                - text: and
                - strong [ref=f1e288]: weekly
                - text: "meters - each shows how much of the window you've used and when it resets:"
              - generic [ref=f1e292]:
                - code [ref=f1e297]: Usage limits 5-hour ███░░░░░░░ 32% · resets in 3h 12m Weekly ████░░░░░░ 41% · resets in 2d 4h
                - button "Copy" [ref=f1e298] [cursor=pointer]:
                  - generic: Copied!
              - paragraph [ref=f1e299]: "If you do hit a limit, the CLI tells you which window you reached and when it frees up:"
              - generic [ref=f1e303]:
                - code [ref=f1e308]: You've reached your 5-hour usage limit. Resets in 2h 41m (3:00 PM). Run /upgrade for a higher plan or /extra for on-demand credits.
                - button "Copy" [ref=f1e309] [cursor=pointer]:
                  - generic: Copied!
              - heading [level=2] [ref=f1e311]:
                - link "Usage estimates" [ref=f1e313] [cursor=pointer]:
                  - /url: "#usage-estimates"
              - paragraph [ref=f1e314]: The numbers above are estimates, not ceilings. Your actual usage depends on the models you pick, the length of your prompts, and how long your conversations run.
              - list [ref=f1e315]:
                - listitem [ref=f1e316]:
                  - strong [ref=f1e317]: "A typical request:"
                  - text: ~700–1K input tokens, ~125–200 output tokens, plus ~42K-56K cache reads on average. The calculator below has a cache slider to model your own session.
                - listitem [ref=f1e318]:
                  - strong [ref=f1e319]: "A range, not a single number:"
                  - text: Cheaper models stretch further. On Go, DeepSeek V4 Flash runs ~60K requests with no cache - ~15K once the typical 52K cache reads are included. Our estimates are the
                  - strong [ref=f1e320]: mix average
                  - text: across each plan's typical models.
                - listitem [ref=f1e321]:
                  - strong [ref=f1e322]: "A balanced mix:"
                  - text: Even split across models within each tier. Pro, Max 10×, and Max 20× assume ~35% open-source / ~65% premium.
                - listitem [ref=f1e323]:
                  - strong [ref=f1e324]: "Long conversations cost more:"
                  - text: Every new turn re-reads the full context, so a long-running session burns through credits faster than a fresh one. Use
                  - code [ref=f1e325]: /clear
                  - text: or start a new session for unrelated tasks to keep things efficient.
                - listitem [ref=f1e326]:
                  - strong [ref=f1e327]: "Track the real number:"
                  - text: The
                  - link "Usage" [ref=f1e328] [cursor=pointer]:
                    - /url: https://commandcode.ai/usage
                  - text: page in Studio always reflects the actual price charged per request.
