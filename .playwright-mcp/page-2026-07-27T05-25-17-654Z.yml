                - generic [ref=f1e1883]: Note
                - paragraph [ref=f1e1890]: Open-source models are routed across multiple upstream providers to maintain high availability. The values above are the mean per-provider price. Actual cost on a given request may vary slightly based on which upstream serves it.
              - generic [ref=f1e1891]:
                - generic [ref=f1e1895]: Note
                - paragraph [ref=f1e1902]: "Claude Sonnet 5 rates shown are introductory pricing, in effect through August 31, 2026. From September 1, 2026, standard pricing applies: $3 input / $15 output / $0.30 cache read / $3.75 cache write per million tokens."
              - heading [level=2] [ref=f1e1904]:
                - link "Context windows. Managed for you." [ref=f1e1906] [cursor=pointer]:
                  - /url: "#context-windows-managed-for-you"
              - paragraph [ref=f1e1907]: A context window is the maximum span of tokens (text, images, and code) a model can hold in mind at once. Input prompt plus everything it generates back.
              - paragraph [ref=f1e1908]: Every Command Code session has its own context. As you prompt, read files, and respond, that context fills up. Command Code compresses older messages automatically, so you can keep going without starting over.
              - paragraph [ref=f1e1909]: Context window size depends on the model. Command Code supports model-specific context windows, with up to 1 million tokens supported on Claude Fable 5, Claude Sonnet 5, Claude Sonnet 4.6, Claude Opus 4.8, Claude Opus 4.7, and DeepSeek V4 Pro.
