                - paragraph [ref=e284]:
                  - text: Send the header
                  - code [ref=e285]: "x-cmdc-zdr: 1"
                  - text: on any request to enforce zero data retention and no prompt training - the same opt-in the CLI exposes via
                  - code [ref=e286]: CMD_ZDR=1
                  - text: ". When set, the request routes only through ZDR-capable upstreams: if a model has no ZDR-capable upstream the request"
                  - strong [ref=e287]: fails
                  - text: with a
                  - code [ref=e288]: "422"
                  - text: (
                  - code [ref=e289]: cmd_zdr_no_providers
                  - text: ) rather than falling back to a non-ZDR provider.
                - paragraph [ref=e290]:
                  - text: ZDR can change which upstream serves your request, so it may cost more depending on the provider. Anthropic models on
                  - code [ref=e291]: /v1/messages
                  - text: are zero-data-retention at the account level, so the header is accepted there for parity but does not change routing.
