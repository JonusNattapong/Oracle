          - heading "What changed" [level=2] [ref=f8e148]
          - paragraph [ref=f8e149]:
            - text: DeepSeek's official docs say the legacy
            - code [ref=f8e150]: "`deepseek-chat`"
            - text: and
            - code [ref=f8e151]: "`deepseek-reasoner`"
            - text: names map to DeepSeek V4 Flash compatibility modes until deprecation on July 24, 2026. New integrations should use the current V4 model identifiers.
          - paragraph [ref=f8e152]: V4 Flash is the budget model. V4 Pro is the higher-capacity option. Both support thinking and non-thinking modes, long context, tool calls, JSON output, and the OpenAI-compatible base URL.
          - heading "When DeepSeek makes sense" [level=2] [ref=f8e153]
          - paragraph [ref=f8e154]: DeepSeek is strongest when cost is a hard constraint and your application can tolerate some provider-specific behavior. It is especially useful for high-volume classification, routing, extraction, and batch analysis jobs where a small per-token difference becomes material.
          - paragraph [ref=f8e155]: For agent workflows, test tool-calling and latency before routing all traffic to DeepSeek. A cheap model that adds retries or manual review can cost more than it saves.
          - heading "Migration notes" [level=2] [ref=f8e156]
          - paragraph [ref=f8e157]: DeepSeek exposes an OpenAI-compatible API, so many clients only need a base URL and model-name change. Keep the model identifier configurable and log token usage before and after migration.
          - paragraph [ref=f8e158]: If your app depends on reasoning behavior, verify whether you want thinking mode enabled for every request. Cheap reasoning can still become expensive if prompts trigger long hidden chains of thought or large outputs.
