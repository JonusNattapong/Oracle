name: CI

on:
  push:
    branches: [ main, "claude/*", "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (if available)
        run: npm run lint 2>/dev/null || true

      - name: Run tests
        run: npm test

      - name: Run verification suite
        run: npm run verify

      - name: Check memory eval (if dataset exists)
        run: |
          if [ -f "tests/memory/eval.dataset.json" ]; then
            echo "Memory eval dataset found"
          fi

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CLI smoke test
        run: npm run build && node dist/cli/index.js doctor

      - name: Runtime smoke test (optional)
        run: |
          timeout 5 npm run dev || true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check 2>/dev/null || npx tsc --noEmit
