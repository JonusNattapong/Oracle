name: CI

on:
  push:
    branches: [ main, "claude/*", "feature/*" ]
  pull_request:
    branches: [ main ]

# A push to a PR branch matches both triggers above and would otherwise start
# two identical runs. Group by the head commit so both events land in the same
# group: on pull_request, github.sha is the merge commit rather than the head,
# so read the head sha explicitly. Also drops superseded runs on re-push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # package.json requires node >=24, and the runtime/memory stores import
        # node:sqlite, which does not exist before 22.5. Anything older fails at
        # import time rather than on an assertion.
        node-version: [ 24.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The project's own smoke scripts. `oracle doctor` is not usable as a
      # smoke check here: it exits 1 when no provider is configured, which is
      # the normal state of a CI runner holding no API keys.
      - name: CLI smoke test
        run: npm run test:cli

      - name: Runtime smoke test
        run: npm run test:runtime

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      # `verify` gates on lint before it runs the tests, but CI never called it,
      # so a lint error could only ever surface locally or at publish time.
      # Neither step needs the build, which is why they share this job.
      - name: Lint
        run: npm run lint
